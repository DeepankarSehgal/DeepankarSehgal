<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deepankar Sehgal · 3D Coastal Workbench Portfolio</title>
  <meta name="description" content="Deepankar Sehgal — Senior Unity & XR Developer with 5+ years building industrial VR simulations, Steam AA releases, and high-concurrency multiplayer systems.">
  <meta name="theme-color" content="#d9e3dc">

  <!-- Typography: Bricolage Grotesque, Figtree, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- WebGL 3D Canvas Stage -->
  <div id="stage"></div>

  <!-- Loading Screen -->
  <div id="loader">
    <div class="spinner"></div>
    <span>Setting up the coastal studio</span>
  </div>

  <!-- Top-Left Branding & Status -->
  <div class="hud" id="brand">
    <h1>Deepankar Sehgal</h1>
    <p>Senior Unity &amp; XR Developer with 5+ years building VR training simulations, Steam AA titles, and scalable multiplayer systems.</p>
    
    <div class="badge-row">
      <span class="status-pill"><span class="status-dot"></span> Available for Roles</span>
      <span class="time-pill" id="time-label">Coastal Studio · IST</span>
    </div>

    <div class="visitor-pill" id="visitor-label" hidden></div>
  </div>

  <!-- Top-Right Navigation -->
  <nav class="hud" id="nav" aria-label="Main Navigation">
    <button class="chip" id="btn-vr" type="button"><i class="fa-solid fa-vr-cardboard"></i> VR &amp; XR</button>
    <button class="chip" id="btn-pc" type="button"><i class="fa-brands fa-steam"></i> PC &amp; Steam</button>
    <button class="chip" id="btn-phone" type="button"><i class="fa-solid fa-mobile-screen"></i> Mobile &amp; Web3</button>
    <button class="chip" id="btn-notes" type="button"><i class="fa-solid fa-book-open"></i> Notes</button>
    <button class="chip" id="btn-approach" type="button"><i class="fa-solid fa-compass"></i> How I Work</button>
    <button class="chip" id="btn-about" type="button"><i class="fa-solid fa-user"></i> About</button>
    <button class="chip" id="btn-contact" type="button"><i class="fa-solid fa-envelope"></i> Contact</button>
    <a class="chip highlight" href="assets/Deepankar_UnityDeveloper_CV.pdf" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-file-pdf"></i> Resume ↗</a>
  </nav>

  <!-- Bottom-Left Environment Lighting Controls -->
  <div class="hud" id="env-controls" aria-label="Atmospheric Lighting Presets">
    <button class="env-btn active" data-mode="day" type="button"><i class="fa-solid fa-sun"></i> Midday</button>
    <button class="env-btn" data-mode="sunset" type="button"><i class="fa-solid fa-cloud-sun"></i> Sunset</button>
    <button class="env-btn" data-mode="night" type="button"><i class="fa-solid fa-moon"></i> Night</button>
  </div>

  <!-- Bottom Center Interaction Prompt -->
  <div class="hud" id="hint">
    <span id="hint-text"><b>Click</b> any device on the desk. <b>Drag</b> to look around.</span>
  </div>

  <!-- Sliding Dock Panel (Projects, Case Studies & Comms) -->
  <aside id="panel" aria-live="polite">
    <div class="panel-head">
      <div>
        <div class="eyebrow" id="panel-eyebrow">Platform</div>
        <h2 id="panel-title">Title</h2>
      </div>
      <button class="iconbtn" id="panel-close" type="button" aria-label="Close panel">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- Screen Reader Accessible Fallback -->
  <nav class="sr" aria-label="All work catalog">
    <ul id="sr-list"></ul>
  </nav>

  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
